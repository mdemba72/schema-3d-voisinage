<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Schéma 3D</title>
    <script>
      // GitHub Pages n'a pas de routeur : toute adresse inconnue revient à l'accueil du dépôt.
      var depot = location.pathname.split('/')[1]
      location.replace(location.hostname.endsWith('github.io') && depot ? '/' + depot + '/' : '/')
    </script>
  </head>
  <body>
    <p><a href="./">Revenir au schéma</a></p>
  </body>
</html>
